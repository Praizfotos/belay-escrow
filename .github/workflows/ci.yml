name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public placeholders for CI only. Real values are injected in deployment environments.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      NEXT_PUBLIC_CONTRACT_ID: CTestBelayContractIdForCi
      NEXT_PUBLIC_VAULT_CONTRACT_ID: CTestVaultContractIdForCi
      NEXT_PUBLIC_ESCROW_TOKEN_ID: CTestEscrowTokenIdForCi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Lint Supabase SQL (search_path mutable & security checks)
        run: |
          node -e "
            const fs = require('fs');
            const sql = fs.readFileSync('supabase-setup.sql', 'utf8');
            const funcs = sql.split(/CREATE OR REPLACE FUNCTION/i).slice(1);
            let errors = 0;
            for (const chunk of funcs) {
              const header = chunk.split(/\$\$|\$body\$/i)[0];
              const nameMatch = header.match(/^\s*([a-zA-Z0-9_\.]+)/);
              const funcName = nameMatch ? nameMatch[1] : 'unknown';
              if (!/search_path\s*=/i.test(header)) {
                console.error('ERROR: Function ' + funcName + ' is missing SET search_path');
                errors++;
              }
            }
            if (errors > 0) {
              console.error('Failed Supabase DB function search_path lint with ' + errors + ' errors.');
              process.exit(1);
            }
            console.log('Passed Supabase DB function search_path lint.');
          "

      - name: Validate Supabase SQL Syntax
        run: |
          docker run --name pg-lint -e POSTGRES_PASSWORD=postgres -d postgres
          sleep 5
          docker exec -i pg-lint psql -U postgres -v ON_ERROR_STOP=1 -f - < supabase-setup.sql

      - name: Test with coverage gate
        run: npm run test:coverage -- --runInBand

      - name: Build
        run: npm run build

  rust-contract:
    name: Rust Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Matches contract/rust-toolchain.toml: Soroban contracts build for
          # wasm32v1-none, not wasm32-unknown-unknown.
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh

      - name: Run contract tests
        working-directory: contract
        run: cargo test

      - name: Build contracts for WASM (belay-contract + belay-vault)
        run: stellar contract build --manifest-path contract/Cargo.toml

      - name: Check WASM size (both contracts)
        run: |
          MAX_SIZE=131072
          status=0
          for WASM_FILE in \
            contract/target/wasm32v1-none/release/belay_contract.wasm \
            contract/target/wasm32v1-none/release/belay_vault.wasm
          do
            if [ ! -f "$WASM_FILE" ]; then
              echo "Error: expected WASM artifact not found: $WASM_FILE"
              status=1
              continue
            fi
            SIZE=$(stat -c%s "$WASM_FILE")
            echo "$WASM_FILE: $SIZE bytes (limit $MAX_SIZE)"
            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "Error: $WASM_FILE exceeds the deployment size limit of $MAX_SIZE bytes."
              status=1
            fi
          done
          exit $status
